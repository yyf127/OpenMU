name: Build OpenMU Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      # Restore 时为 win-x64 准备依赖
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/MUnique.OpenMU.sln


      # Solution Build 不指定 Runtime
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/MUnique.OpenMU.sln `
            --configuration Release `
            --no-restore


      # Publish 单独指定 Windows Runtime
      # 不使用 --no-build，让 publish 自己处理 RID
      - name: Publish OpenMU
        shell: pwsh
        run: |
          dotnet publish `
            src/Startup/MUnique.OpenMU.Startup.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/OpenMU `
            /p:PublishTrimmed=false `
            /p:PublishSingleFile=false


      - name: Create Start Script
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          MUnique.OpenMU.Startup.exe
          pause
          '@ | Out-File publish/OpenMU/StartServer.bat -Encoding ascii


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMU-Windows-x64
          path: publish/OpenMU
          retention-days: 30
